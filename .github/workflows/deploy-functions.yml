name: Deploy Edge Functions

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck gate
        run: pnpm --filter web run typecheck

      - name: Test gate
        run: pnpm --filter web run test

      - name: Prettier gate
        run: pnpm exec prettier --check supabase/functions/conversation-handle/index.ts supabase/functions/whatsapp-dispatch/index.ts supabase/functions/whatsapp-webhook-inbound/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration..."
            SQL=$(cat "$migration")
            PAYLOAD=$(jq -n --arg q "$SQL" '{"query": $q}')
            STATUS=$(curl -s -o /tmp/mig_response.json -w "%{http_code}" \
              -X POST \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "Status $STATUS for $migration"
            cat /tmp/mig_response.json
            # 200 = success, 400 com "already exists" = idempotente (ok)
            if [ "$STATUS" != "200" ]; then
              DETAIL=$(cat /tmp/mig_response.json)
              if echo "$DETAIL" | grep -qi "already exists\|does not exist\|duplicate"; then
                echo "Idempotent: skipping"
              else
                echo "Migration failed — aborting"
                exit 1
              fi
            fi
          done

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy whatsapp-webhook-inbound --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy conversation-handle --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy whatsapp-dispatch --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy lead-notify-broker --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy qr-resolve --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
