name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Environment com secrets isolados"
        required: true
        type: choice
        options:
          - staging
          - production
      confirm_production:
        description: "Para production, digite DEPLOY_PRODUCTION"
        required: false
        type: string

jobs:
  deploy:
    environment: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck gate
        run: pnpm --filter web run typecheck

      - name: Test gate
        run: pnpm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate selected environment configuration
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          CONFIGURED_ENVIRONMENT: ${{ vars.SUPABASE_ENVIRONMENT_NAME }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$CONFIGURED_ENVIRONMENT" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Environment deploy secrets are incomplete."
            exit 1
          fi
          if [ "$TARGET_ENVIRONMENT" != "$CONFIGURED_ENVIRONMENT" ]; then
            echo "Configured environment does not match selected target."
            exit 1
          fi

      - name: Require explicit production approval
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "production" ] && [ "$CONFIRM_PRODUCTION" != "DEPLOY_PRODUCTION" ]; then
            echo "Production deploy blocked: type DEPLOY_PRODUCTION and approve the protected GitHub Environment."
            exit 1
          fi

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy whatsapp-webhook-inbound --project-ref ${{ vars.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy conversation-handle --project-ref ${{ vars.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy whatsapp-dispatch --project-ref ${{ vars.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy bot-health-monitor --project-ref ${{ vars.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy lead-notify-broker --project-ref ${{ vars.SUPABASE_PROJECT_ID }} --use-api
          supabase functions deploy qr-resolve --project-ref ${{ vars.SUPABASE_PROJECT_ID }} --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
