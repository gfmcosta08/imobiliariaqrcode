name: Deploy Edge Functions Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_STAGING_FUNCTIONS to deploy all Supabase Edge Functions to staging"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy staging Edge Functions
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck gate
        run: pnpm --filter web run typecheck

      - name: Test gate
        run: pnpm --filter web run test

      - name: Prettier gate
        run: pnpm exec prettier --check "supabase/functions/**/*.ts" "supabase/functions/**/*.md"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Assert staging deploy target
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "DEPLOY_STAGING_FUNCTIONS" ]]; then
            echo "Refusing to deploy functions without DEPLOY_STAGING_FUNCTIONS confirmation."
            exit 1
          fi

          if [[ "$SUPABASE_PROJECT_REF" != "coeuoyeydqoslhvbbojx" ]]; then
            echo "Refusing to deploy functions outside Supabase staging."
            exit 1
          fi

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --jobs 2
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
