name: Monitor WhatsApp Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run monitor (read-only)
        continue-on-error: true
        run: node scripts/monitor-whatsapp-silence.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.BOT_MONITOR_ALERT_WEBHOOK_URL }}
          BOT_MONITOR_SLA_SECONDS: "90"
          BOT_MONITOR_PENDING_MINUTES: "3"
          BOT_MONITOR_QUEUE_STUCK_MINUTES: "10"
          BOT_MONITOR_LOOKBACK_MINUTES: "20"
